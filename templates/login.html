{% extends "base.html" %}{% block body %}
<div class="masuk">
  <div class="kop">
    <img src="/static/logo-mflash.png" alt="MFlash">
    <h1>Pengajuan Insentif</h1>
    <p>Masuk dengan akun yang diberikan administrator</p>
  </div>
  <div class="card">
    {% if error %}<p class="err" style="margin-bottom:6px">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>Username</label>
      <input name="username" style="width:100%" required autofocus autocapitalize="off">
      <label>Password</label>
      <input name="password" type="password" style="width:100%" required>
      <p style="margin:18px 0 0"><button style="width:100%">Masuk</button></p>
    </form>
  </div>
  <div class="kaki">
    <img src="/static/logo-madinah.png" alt="Madinah Group Indonesia">
    PT Madinah Solusi Teknologi
  </div>
</div>
{% endblock %}
