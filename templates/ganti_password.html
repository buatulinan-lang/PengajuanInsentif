{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:460px;margin:40px auto">
<h1>Ganti Password</h1>
<p class="mut" style="margin-top:-8px">Berlaku untuk akun
<b>{{ me.username }}</b>.</p>
{% if pesan %}<p class="err" style="background:#e4f5ea;border-color:#aedcc0;color:#1f6f43">
{{ pesan }}</p>{% endif %}
{% if galat %}<p class="err">{{ galat }}</p>{% endif %}
<form method="post" action="/akun/password">
<label>Password Lama</label>
<input name="lama" type="password" style="width:100%" required autofocus>
<label>Password Baru (minimal {{ minimal }} karakter)</label>
<input name="baru" type="password" style="width:100%" required minlength="{{ minimal }}">
<label>Ulangi Password Baru</label>
<input name="ulangi" type="password" style="width:100%" required minlength="{{ minimal }}">
<p><button>Simpan</button></p>
</form></div>
{% endblock %}
