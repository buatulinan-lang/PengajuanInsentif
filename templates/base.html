<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Pengajuan Insentif{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--ink:#1c2024;--mut:#6b7280;--acc:#1f6f43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--acc);color:#fff;padding:12px 20px;display:flex;
align-items:center;gap:16px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;opacity:.9}header a:hover{opacity:1}
.brand{font-weight:600}.sp{flex:1}
main{max-width:1080px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:18px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
th{background:#f1f3f5;font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;
font-weight:600;border:1px solid}
.b-draft{background:#f1f3f5;border-color:#d7dbe0;color:#495057}
.b-arm{background:#fff4e0;border-color:#f0d199;color:#9a6400}
.b-ceo{background:#e7f0ff;border-color:#b9d0f7;color:#14509a}
.b-fin{background:#f0e9ff;border-color:#cebdf5;color:#5b34a8}
.b-done{background:#e4f5ea;border-color:#aedcc0;color:#1f6f43}
.b-rej{background:#fdeaea;border-color:#f3bcbc;color:#a52020}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--line);
border-radius:7px;background:#fff}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px;font-weight:600}
button{background:var(--acc);color:#fff;border:0;cursor:pointer;font-weight:600}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.warn{background:#a52020}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tl{list-style:none;padding:0;margin:0}
.tl li{padding:7px 0 7px 22px;position:relative;color:var(--mut)}
.tl li:before{content:"";position:absolute;left:4px;top:14px;width:9px;height:9px;
border-radius:50%;background:#cdd3d9}
.tl li.ok{color:var(--ink)}.tl li.ok:before{background:var(--acc)}
.mut{color:var(--mut)}.right{text-align:right}
a.btn{display:inline-block;background:var(--acc);color:#fff;padding:8px 14px;
border-radius:7px;text-decoration:none;font-weight:600}
.err{background:#fdeaea;border:1px solid #f3bcbc;color:#a52020;padding:9px 12px;border-radius:7px}
</style></head><body>
{% if me %}<header><span class="brand">Pengajuan Insentif</span>
<a href="/">Dashboard</a>
{% if me.role in ['store_leader','admin'] %}<a href="/pengajuan/baru">Buat Pengajuan</a>{% endif %}
{% if me.role in ['admin','arm'] %}<a href="/master/cabang">Master Cabang</a>
<a href="/master/sales">Master Sales</a>
<a href="/master/supplier">Master Supplier</a>{% endif %}
<span class="sp"></span>
<span>{{ me.full_name }} · {{ ROLE_LABELS[me.role] }}</span>
<a href="/logout">Keluar</a></header>{% endif %}
<main>{% block body %}{% endblock %}</main></body></html>
