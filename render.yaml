services:
  - type: web
    name: pengajuan-insentif
    runtime: python
    plan: free                 # ganti ke "starter" bila sudah dipakai produksi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET            # kunci sesi login, dibuat otomatis oleh Render
        generateValue: true
      - key: DATABASE_URL      # connection string Supabase (Session pooler, port 5432)
        sync: false
      - key: BASE_URL          # https://<nama-app>.onrender.com  -> dipakai isi QR
        sync: false
      - key: SEED_PASSWORD     # password awal semua akun contoh
        sync: false
